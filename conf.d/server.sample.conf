# Tinybackup server configuration file
# Copy to conf.d/${HOSTNAME%%.*}.conf and configure the repository

# ===============================================
# Repository Configuration
# ===============================================

# Kopia repository must be accessible and writable
# Select one repository type (REPO_TYPE is required) and configure related variables
# Example: to use a SFTP repository uncomment SFTP configuration variables

# -- LOCAL --
# On a removable disk, use a subdirectory of the mount point so that if the disk
#   is not mounted, the backup fails instead of creating a repository on the system disk
REPO_TYPE='local'
LOCAL_DIR='/mnt/backup/kopia/repository'  # must exist

# -- RCLONE --
#REPO_TYPE='rclone'
#RCLONE_REMOTE='dropbox'
#RCLONE_CONFIG='/home/local/rclone.conf'  # optional
#RCLONE_PATH='backup/repository'

# -- S3 --
#REPO_TYPE='s3'
#S3_BUCKET='backup-bucket'
#S3_PATH=''  # optional
#S3_KEY_ID='key'
#S3_SECRET_KEY='secret'
#S3_ENDPOINT='s3.provider.com'
#S3_REGION=''  # optional
#S3_OPTS=('--disable-tls')  # optional, extra kopia s3 options

# -- SFTP --
#REPO_TYPE='sftp'
#SFTP_USER='remote'
#SFTP_HOST='192.168.10.100'
#SFTP_PORT='22'  # optional
#SFTP_KEY='/home/local/.ssh/id_ed25519'
#SFTP_PATH='/remote/backup/repository'
#SFTP_KNOWN_HOSTS='/root/.ssh/known_hosts'  # optional, default ~/.ssh/known_hosts
# Trust the ECDSA host key once beforehand (as root), kopia checks this key type (kopia#2948):
#   ssh -o HostKeyAlgorithms=ecdsa-sha2-nistp256 -p PORT -i KEY USER@HOST exit

# ===============================================
# Backup rules
# ===============================================

# Policy updates
# Set to true to apply retention and ignore rules to the repository policies at each backup
# Set to false to apply them only on the first backup of this host
# Policy can be updated manually with 'tinybakcup policy --update'
POLICY_AUTO_UPDATES=false

# Retention rules
# Number of snapshots to keep for each period
# Set value to 0 to disable a period
RETENTION_CONFIG=(
    'latest=10'   # Keep the 10 most recent snapshots
    'hourly=0'    # Disable hourly retention
    'daily=7'     # Keep 7 daily snapshots (~1 week)
    'weekly=4'    # Keep 4 weekly snapshots (~1 month)
    'monthly=6'   # Keep 6 monthly snapshots (~6 months)
    'annual=5'    # Keep 5 annual snapshots (~5 years)
)

# Backup hooks
# Provide either a full command or a path to a script.
# A failing pre-backup hook aborts the backup, the post-backup hook always runs.
# Example: dump databases to /var/backups (included with /var) before the snapshot
#PRE_BACKUP_HOOK='umask 077; runuser -u postgres -- pg_dumpall > /var/backups/postgresql.sql'
#PRE_BACKUP_HOOK='umask 077; mysqldump --all-databases --single-transaction > /var/backups/mysql.sql'
#POST_BACKUP_HOOK=''

# Backup directories
# List of all directories to include in backup.
# Make sure paths exist and contents are readable by the user running the script.
TO_BACKUP=(
    '/home'
    '/root'
    '/etc'
    '/var'
    '/srv'
    '/usr/local'
    '/opt'
)

# Exclude directories
# For each directory, define an array of patterns to exclude from backup.
# Variable names must follow the pattern: IGNORE_<DIR> e.g. /usr/local => IGNORE_USR_LOCAL
# Non-alphanumeric characters become "_" e.g. /srv/my-data => IGNORE_SRV_MY_DATA
# Kopia also skips directories containing a CACHEDIR.TAG file and honors .kopiaignore files.
#
# Use Kopia ignore syntax: https://kopia.io/docs/advanced/kopiaignore/#supported-patterns
# Negations ('!pattern') only work in .kopiaignore files: kopia sorts the rules set here.
# *       matches zero or more characters (but not '/')
# **      matches zero or more directories
# ?       matches exactly one character (but not '/')
# [abc]   matches any single character listed between brackets
# [!abc]  matches any single character NOT listed between brackets
# /       if pattern starts with '/', relative to the backup directory e.g. '/cache' in IGNORE_VAR => /var/cache
# foo/    matches directory 'foo' and everything inside
#
# Examples:
#   *.log          ignore all .log files (in all directories)
#   test           ignore all 'test' directories or files
#   temp/          ignore 'temp' directories
#   **/cache/      ignore any 'cache' folder at any depth

# Comment a line to disable
IGNORE_HOME=(
    # === Caches & temp ===
    '**/.cache'                        # Cache
    '**/.local/share/Trash'            # Trash
)

# Root directory: inherit home ignores + custom root excludes
IGNORE_ROOT=(
    "${IGNORE_HOME[@]}"                # Include all home ignores
)

IGNORE_ETC=(
    # Add patterns for /etc if needed
)

IGNORE_VAR=(
    '/cache'                           # Package caches
    '/tmp'                             # Temporary files
    '/crash'                           # Crash reports
    '/lib/systemd/coredump'            # Core dumps
)

IGNORE_SRV=(
    # Add patterns for /srv if needed
)

IGNORE_USR_LOCAL=(
    # Add patterns for /usr/local if needed
)

IGNORE_OPT=(
    # Add patterns for /opt if needed
)
